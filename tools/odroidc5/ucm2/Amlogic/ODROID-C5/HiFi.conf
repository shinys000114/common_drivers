# The device tree sets every route when the card binds; each device sets
# its own again when it is enabled, in case a saved mixer state changed it.

SectionVerb {
	Value.TQ "HiFi"
}

SectionDevice."HDMI1" {
	Comment "HDMI"

	EnableSequence [
		cset "name='FRDDR_A SINK 1 SEL' 'OUT 1'"
		cset "name='FRDDR_A SRC 1 EN Switch' on"
		cset "name='TDMOUT_B SRC SEL' 'IN 0'"
		cset "name='TOHDMITX I2S SRC' 'I2S B'"
		cset "name='TOHDMITX I2S OUT EN Switch' on"
	]

	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		JackControl "HDMI Jack"
	}

	# A sink without these speakers makes the variant fail to open, and
	# PipeWire then drops its profiles.
	Variant."HiFi 5+1".Value.PlaybackChannels 6
	Variant."HiFi 7+1".Value.PlaybackChannels 8
}

SectionDevice."Line1" {
	Comment "Line Out"

	EnableSequence [
		cset "name='FRDDR_C SINK 1 SEL' 'OUT 2'"
		cset "name='FRDDR_C SRC 1 EN Switch' on"
		cset "name='TDMOUT_C SRC SEL' 'IN 2'"
		cset "name='TOACODEC SRC' 'I2S C'"
		cset "name='TOACODEC OUT EN Switch' on"
		# The 40-pin I2S, which plays only with the i2s overlay
		cset "name='FRDDR_C SINK 2 SEL' 'OUT 0'"
		cset "name='FRDDR_C SRC 2 EN Switch' on"
		cset "name='TDMOUT_A SRC SEL' 'IN 2'"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},2"
		PlaybackChannels 2
		PlaybackMixerElem "ACODEC"
	}
}

# SPDIF A reaches a pin only with the spdif_a overlay, which gives the
# SPDIFOUT_A node its pin state.
If.spdif {
	Condition {
		Type Path
		Path "/sys/firmware/devicetree/base/soc/bus@fe330000/audio-controller@480/pinctrl-0"
		Mode exist
	}
	True.SectionDevice."SPDIF" {
		Comment "S/PDIF Out"

		EnableSequence [
			cset "name='FRDDR_D SINK 1 SEL' 'OUT 3'"
			cset "name='FRDDR_D SRC 1 EN Switch' on"
			cset "name='SPDIFOUT_A SRC SEL' 'IN 3'"
		]

		Value {
			PlaybackPriority 100
			PlaybackPCM "hw:${CardId},3"
			PlaybackChannels 2
		}
	}
}
