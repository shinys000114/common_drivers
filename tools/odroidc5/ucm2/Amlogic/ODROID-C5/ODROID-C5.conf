Syntax 6

#
# ODROID-C5 (Amlogic S7D) native sound card: driver axg-sound-card,
# card AML-AUGESOUND. Its PCM devices follow the vendor card's order:
#
#   0  HDMI through TDM B and the transmitter's I2S input, 2 to 8 channels
#   1  HDMI through SPDIF B and the transmitter's SPDIF input, 2 channels
#   2  line out of the internal DAC, and the 40-pin I2S with the i2s overlay
#   3  SPDIF out on 40-pin pin 29 with the spdif_a overlay
#   4  TDMIN_LB capture of an output, for loopback tests
#
# Device 1 reaches the same sink as device 0 and the transmitter takes one
# stream at a time, so only device 0 is offered for HDMI. Device 4 records
# what an output plays, not an input, and is left out.
#

Comment "ODROID-C5"

SectionUseCase."HiFi" {
	File "/Amlogic/ODROID-C5/HiFi.conf"
	Comment "Play HiFi quality music"

	Variant."HiFi" {
		Comment "HiFi, HDMI stereo"
	}

	Variant."HiFi 5+1" {
		Comment "HiFi, HDMI 5.1 surround"
	}

	Variant."HiFi 7+1" {
		Comment "HiFi, HDMI 7.1 surround"
	}
}
