%YAML 1.2
---
$id: http://devicetree.org/schemas/memory-controllers/amlogic,s7d-dmc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic S7D DMC request and drain system controller

maintainers:
  - YoungSoo Shin <shinys000114@gmail.com>

description: |
  The DMC request control and channel status registers gate and drain DMA
  requests from video codec engines. Consumers obtain the shared register
  map with an amlogic,dmc-syscon phandle. This system controller describes
  the 8 KiB control aperture, not the separate DDR controller register map.

properties:
  compatible:
    items:
      - const: amlogic,s7d-dmc
      - const: syscon

  reg:
    maxItems: 1
    description: DMC control register aperture, 8 KiB.

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscon@fe036000 {
        compatible = "amlogic,s7d-dmc", "syscon";
        reg = <0xfe036000 0x2000>;
    };
