%YAML 1.2
---
$id: http://devicetree.org/schemas/dma-buf/hardkernel,odroidc5-scanout-heap.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Hardkernel ODROID-C5 contiguous graphics DMA heap

maintainers:
  - YoungSoo Shin <shinys000114@gmail.com>

description: |
  This board device exports one dedicated reusable CMA pool for contiguous
  graphics DMA-BUF allocations. It is separate from the shared-dma-pool node
  below /reserved-memory and must reference that pool with memory-region.
  The referenced pool must have compatible shared-dma-pool and reusable;
  it must not have no-map. No MMIO resource or interrupt is associated with
  the heap device.

properties:
  compatible:
    const: hardkernel,odroidc5-scanout-heap

  memory-region:
    maxItems: 1
    description: Dedicated reusable shared-dma-pool for graphics buffers.

required:
  - compatible
  - memory-region

additionalProperties: false

examples:
  - |
    graphics-heap {
        compatible = "hardkernel,odroidc5-scanout-heap";
        memory-region = <&graphics_pool>;
    };
