%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/amlogic,s7d-audio-fifo.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic S7D audio FIFO controllers

maintainers:
  - YoungSoo Shin <shinys000114@gmail.com>

description:
  FRDDR (playback) and TODDR (capture) DMA FIFOs of the S7D audio block.
  The register layout follows the SM1, with an 8-bit channel count in
  FRDDR CTRL2 and a 5-bit TODDR source select.

properties:
  compatible:
    enum:
      - amlogic,s7d-frddr
      - amlogic,s7d-toddr

  reg:
    maxItems: 1

  "#sound-dai-cells":
    const: 0

  clocks:
    items:
      - description: Peripheral clock

  interrupts:
    maxItems: 1

  resets:
    items:
      - description: Memory arbiter port
      - description: FIFO reset

  reset-names:
    items:
      - const: arb
      - const: rst

  amlogic,fifo-depth:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Size of the controller's fifo in bytes

required:
  - compatible
  - reg
  - "#sound-dai-cells"
  - clocks
  - interrupts
  - resets
  - reset-names
  - amlogic,fifo-depth

allOf:
  - $ref: dai-common.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/amlogic,s7d-audio-clkc.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/reset/amlogic,meson-axg-audio-arb.h>
    #include <dt-bindings/reset/amlogic,s7d-audio-reset.h>

    audio-controller@1c0 {
        compatible = "amlogic,s7d-frddr";
        reg = <0x1c0 0x2c>;
        #sound-dai-cells = <0>;
        clocks = <&clkc_audio CLKID_AUDIO_GATE_FRDDRA>;
        interrupts = <GIC_SPI 36 IRQ_TYPE_EDGE_RISING>;
        resets = <&arb AXG_ARB_FRDDR_A>, <&clkc_audio S7D_AUDIO_RESET_FRDDRA>;
        reset-names = "arb", "rst";
        amlogic,fifo-depth = <1024>;
    };
