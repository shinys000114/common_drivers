%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/amlogic,s7d-t9015.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic S7D T9015 stereo line-output DAC

maintainers:
  - YoungSoo Shin <shinys000114@gmail.com>

description: |
  The internal DAC receives I2S from TDMOUT C through the audio controller's
  TOACODEC route. It has its own register bank, peripheral clock and reset.
  Its playback DAI consumes the internally supplied serial clocks and has
  no microphone or capture interface.

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: amlogic,s7d-t9015

  '#sound-dai-cells':
    const: 0

  reg:
    maxItems: 1
    description: T9015 register bank.

  clocks:
    maxItems: 1
    description: Codec peripheral bus clock.

  clock-names:
    const: pclk

  resets:
    maxItems: 1
    description: Codec reset.

  reset-names:
    const: acodec

required:
  - compatible
  - '#sound-dai-cells'
  - reg
  - clocks
  - clock-names
  - resets
  - reset-names

unevaluatedProperties: false

examples:
  - |
    codec@fe01a000 {
        compatible = "amlogic,s7d-t9015";
        reg = <0xfe01a000 0x24>;
        #sound-dai-cells = <0>;
        clocks = <&clkc 0>;
        clock-names = "pclk";
        resets = <&reset 0>;
        reset-names = "acodec";
    };
