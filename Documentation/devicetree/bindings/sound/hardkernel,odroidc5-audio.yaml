%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/hardkernel,odroidc5-audio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Hardkernel ODROID-C5 playback sound card

maintainers:
  - YoungSoo Shin <shinys000114@gmail.com>

description: |
  The card connects S7D playback interfaces to the native HDMI bridge,
  internal T9015 DAC and an optional SPDIF transmitter codec. HDMI and
  analog links use I2S with normal polarity and the CPU supplying bit and
  frame clocks. The analog link routes the two DAC line outputs to the
  board's line-output connector. The HDMI codec's graph endpoint connects
  to the VPU display controller for power-management ordering.
  Analog and SPDIF links may be disabled and enabled by board overlays.

$defs:
  dai:
    type: object
    properties:
      sound-dai:
        maxItems: 1
        description: Phandle to the single playback DAI.
    required:
      - sound-dai
    additionalProperties: false

  link:
    type: object
    properties:
      status: true
      cpu:
        $ref: '#/$defs/dai'
      codec:
        $ref: '#/$defs/dai'
    required:
      - cpu
      - codec
    additionalProperties: false

properties:
  compatible:
    const: hardkernel,odroidc5-audio

  hdmi:
    $ref: '#/$defs/link'
    description: TDMOUT B playback to the native HDMI bridge DAI.

  analog:
    $ref: '#/$defs/link'
    description: TDMOUT C playback to the internal T9015 DAC DAI.

  spdif:
    $ref: '#/$defs/link'
    description: SPDIF A playback to a linux,spdif-dit codec DAI.

required:
  - compatible
  - hdmi

additionalProperties: false

examples:
  - |
    sound {
        compatible = "hardkernel,odroidc5-audio";

        hdmi {
            cpu {
                sound-dai = <&hdmi_audio>;
            };
            codec {
                sound-dai = <&hdmi>;
            };
        };

        analog {
            status = "disabled";
            cpu {
                sound-dai = <&analog_audio>;
            };
            codec {
                sound-dai = <&t9015>;
            };
        };

        spdif {
            status = "disabled";
            cpu {
                sound-dai = <&spdif_audio>;
            };
            codec {
                sound-dai = <&spdif_dit>;
            };
        };
    };
