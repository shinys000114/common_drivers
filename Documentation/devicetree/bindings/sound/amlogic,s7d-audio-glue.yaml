%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/amlogic,s7d-audio-glue.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic S7D HDMI TX and internal DAC audio glue

maintainers:
  - YoungSoo Shin <shinys000114@gmail.com>

description:
  TOHDMITX selects the I2S and SPDIF inputs of the HDMI transmitter and
  generates its 128 fs MCLK; TOACODEC selects the TDM output and lanes of
  the internal DAC. Both have split clock and data enables on the S7D.

properties:
  $nodename:
    pattern: "^audio-controller@.*"

  compatible:
    enum:
      - amlogic,s7d-toacodec
      - amlogic,s7d-tohdmitx

  reg:
    maxItems: 1

  resets:
    maxItems: 1

  "#sound-dai-cells":
    const: 1

  clocks:
    items:
      - description: MCLK A
      - description: MCLK B
      - description: MCLK C

  clock-names:
    items:
      - const: mclk-a
      - const: mclk-b
      - const: mclk-c

required:
  - compatible
  - reg
  - resets
  - "#sound-dai-cells"

allOf:
  - $ref: dai-common.yaml#
  - if:
      properties:
        compatible:
          const: amlogic,s7d-toacodec
    then:
      properties:
        clocks: false
        clock-names: false

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/amlogic,s7d-audio-clkc.h>
    #include <dt-bindings/reset/amlogic,s7d-audio-reset.h>

    audio-controller@744 {
        compatible = "amlogic,s7d-tohdmitx";
        reg = <0x744 0x4>;
        #sound-dai-cells = <1>;
        clocks = <&clkc_audio CLKID_AUDIO_MCLK_A>,
                 <&clkc_audio CLKID_AUDIO_MCLK_B>,
                 <&clkc_audio CLKID_AUDIO_MCLK_C>;
        clock-names = "mclk-a", "mclk-b", "mclk-c";
        resets = <&clkc_audio S7D_AUDIO_RESET_TOHDMITX>;
    };
