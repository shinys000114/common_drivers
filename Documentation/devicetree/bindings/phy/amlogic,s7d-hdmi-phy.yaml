%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/amlogic,s7d-hdmi-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic S7D HDMI analogue PHY

maintainers:
  - YoungSoo Shin <shinys000114@gmail.com>

description: |
  The PHY is a child of the amlogic,s7d-clkc clock controller and shares
  its analogue register window. The child has no separate reg resource.
  The clock controller owns the HDMI PLL; the PHY owns HDMIPHY_CTRL0
  through HDMIPHY_CTRL5 at offsets 0x200 through 0x214 of the pll resource.
  Its pixel clock is the HDMI PLL output before the VENC dividers.
  Firmware provides the resistor calibration value through an SMC service.

properties:
  compatible:
    const: amlogic,s7d-hdmi-phy

  '#phy-cells':
    const: 0

  clocks:
    maxItems: 1

  clock-names:
    const: pixel

  resets:
    maxItems: 1

  reset-names:
    const: phy

  power-domains:
    maxItems: 1

required:
  - compatible
  - '#phy-cells'
  - clocks
  - clock-names
  - resets
  - reset-names
  - power-domains

additionalProperties: false

examples:
  - |
    hdmi-phy {
        compatible = "amlogic,s7d-hdmi-phy";
        #phy-cells = <0>;
        clocks = <&clkc 254>;
        clock-names = "pixel";
        resets = <&reset 22>;
        reset-names = "phy";
        power-domains = <&pwrdm 3>;
    };
