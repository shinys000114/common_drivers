%YAML 1.2
---
$id: http://devicetree.org/schemas/reset/amlogic,s7d-reset.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic S7D reset controller

maintainers:
  - YoungSoo Shin <shinys000114@gmail.com>

description: |
  Six banks of 32 reset lines have pulse, LEVEL and MASK registers. LEVEL
  is active low; a set MASK bit holds the corresponding reset deasserted.
  Reset specifiers use the IDs in dt-bindings/reset/amlogic,meson-s7d-reset.h.
  The register resource covers these three banks only. The watchdog,
  secure reset and write-protection registers are outside this resource.

properties:
  compatible:
    const: amlogic,s7d-reset

  reg:
    maxItems: 1
    description: Pulse, LEVEL and MASK registers, 0x98 bytes in total.

  '#reset-cells':
    const: 1

required:
  - compatible
  - reg
  - '#reset-cells'

additionalProperties: false

examples:
  - |
    reset-controller@fe002000 {
        compatible = "amlogic,s7d-reset";
        reg = <0xfe002000 0x98>;
        #reset-cells = <1>;
    };
