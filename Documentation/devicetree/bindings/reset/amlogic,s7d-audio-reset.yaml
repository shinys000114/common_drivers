%YAML 1.2
---
$id: http://devicetree.org/schemas/reset/amlogic,s7d-audio-reset.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic S7D audio reset controller

maintainers:
  - YoungSoo Shin <shinys000114@gmail.com>

description: |
  Child of the amlogic,s7d-audio resource controller. Active-high internal
  resets use SW_RESET0 and SW_RESET1 in the parent's regmap. The top-level
  audio bus reset belongs to the parent, not to this controller.
  Reset IDs are defined in dt-bindings/reset/amlogic,s7d-audio-reset.h.
  IDs 0 through 32 and 40 are valid; the other second-bank bits are reserved.

properties:
  compatible:
    const: amlogic,s7d-audio-reset

  '#reset-cells':
    const: 1

required:
  - compatible
  - '#reset-cells'

additionalProperties: false

examples:
  - |
    reset-controller {
        compatible = "amlogic,s7d-audio-reset";
        #reset-cells = <1>;
    };
