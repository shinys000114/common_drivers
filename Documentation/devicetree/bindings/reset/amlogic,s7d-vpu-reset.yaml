%YAML 1.2
---
$id: http://devicetree.org/schemas/reset/amlogic,s7d-vpu-reset.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic S7D VPU local AFBC reset controller

maintainers:
  - YoungSoo Shin <shinys000114@gmail.com>

description: |
  This reset controller is a child of amlogic,s7d-vpu and shares its
  VCBUS regmap. It owns bits 22 through 19 of VIU_SW_RESET at word offset
  0x1a01. It has no separate register, clock, or power-domain resources.
  The single reset argument selects a reset defined in
  dt-bindings/reset/amlogic,s7d-vpu-reset.h. The parent registers the provider
  before requesting the local resets and controls access to the register bank.

properties:
  compatible:
    const: amlogic,s7d-vpu-reset

  '#reset-cells':
    const: 1

required:
  - compatible
  - '#reset-cells'

additionalProperties: false

examples:
  - |
    display-controller@ff000000 {
        reg = <0xff000000 0x40000>;

        reset-controller {
            compatible = "amlogic,s7d-vpu-reset";
            #reset-cells = <1>;
        };
    };
