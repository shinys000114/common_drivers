%YAML 1.2
---
$id: http://devicetree.org/schemas/power/amlogic,s7d-power-domain.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic S7D firmware power domains

maintainers:
  - YoungSoo Shin <shinys000114@gmail.com>

description: |
  Firmware controls the domain transitions through SMC services. Domain
  specifiers use the IDs in dt-bindings/power/s7d-pd.h. The optional SRAM
  resource contains MEM_PD5 through MEM_PD9 and belongs to this provider.
  It permits retained VPU memory-power state to be checked independently
  of the firmware domain state. Native VPU/HDMI consumers require this
  window. MEM_PD10 and MEM_PD11 are excluded from the resource.

properties:
  compatible:
    const: amlogic,s7d-power-domain

  reg:
    maxItems: 1
    description: VPU SRAM power registers MEM_PD5 through MEM_PD9, 0x14 bytes.

  reg-names:
    const: vpu-sram

  '#power-domain-cells':
    const: 1

required:
  - compatible
  - '#power-domain-cells'

dependencies:
  reg: [reg-names]
  reg-names: [reg]

additionalProperties: false

examples:
  - |
    power-controller@fe00c054 {
        compatible = "amlogic,s7d-power-domain";
        reg = <0xfe00c054 0x14>;
        reg-names = "vpu-sram";
        #power-domain-cells = <1>;
    };
