%YAML 1.2
---
$id: http://devicetree.org/schemas/firmware/amlogic,s7d-video-firmware.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic S7D resident video firmware service

maintainers:
  - YoungSoo Shin <shinys000114@gmail.com>

description: |
  A singleton service below /firmware owns the video firmware archive shared
  by the codec engines. It transfers the archive through OP-TEE using SMC.
  Codec consumers reference this node with amlogic,video-firmware and must
  reference the same OP-TEE device with amlogic,tee. The service has no MMIO
  aperture, interrupt, clock or reserved-memory region of its own.

properties:
  compatible:
    const: amlogic,s7d-video-firmware

  amlogic,tee:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to an enabled linaro,optee-tz device using SMC.

required:
  - compatible
  - amlogic,tee

additionalProperties: false

examples:
  - |
    firmware {
        video-firmware {
            compatible = "amlogic,s7d-video-firmware";
            amlogic,tee = <&optee>;
        };
    };
