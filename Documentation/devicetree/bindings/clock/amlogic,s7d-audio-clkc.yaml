%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/amlogic,s7d-audio-clkc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic S7D audio clock controller

maintainers:
  - YoungSoo Shin <shinys000114@gmail.com>

description: |
  Child of the amlogic,s7d-audio resource controller. Gates, master-clock
  muxes and dividers, serial clocks and HDMI/SPDIF clock routing use the
  parent's regmap. No separate register range or reset provider is exposed.
  Clock IDs are defined in dt-bindings/clock/amlogic,s7d-audio-clkc.h.

properties:
  compatible:
    const: amlogic,s7d-audio-clkc

  '#clock-cells':
    const: 1

  clocks:
    items:
      - description: Peripheral bus clock.
      - description: HIFI1 PLL, used for the 44.1 kHz rate family.
      - description: HIFI0 PLL, used for the 48 kHz rate family.
      - description: Fixed PLL divided by three.
      - description: Fixed PLL divided by four.
      - description: Crystal oscillator.

  clock-names:
    items:
      - const: pclk
      - const: hifi1
      - const: hifi0
      - const: fclk-div3
      - const: fclk-div4
      - const: xtal

required:
  - compatible
  - '#clock-cells'
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    clock-controller {
        compatible = "amlogic,s7d-audio-clkc";
        #clock-cells = <1>;
        clocks = <&clkc 0>, <&clkc 1>, <&clkc 2>,
                 <&clkc 3>, <&clkc 4>, <&xtal>;
        clock-names = "pclk", "hifi1", "hifi0", "fclk-div3",
                      "fclk-div4", "xtal";
    };
